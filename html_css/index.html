          <img src="img/garlic.png" alt="garlic" class="card_icon" />
          <div class="card_title">garlic</div>
        </li>

          <img src="img/beef.png" alt="beef" class="card_icon" />
          <div class="card_title">beef</div>
        </li>
        <li class="card">
          <img src="img/fish.png" alt="fish" class="card_icon" />
          <div class="card_title">fish</div>
        </li>
        <li class="card">
          <img src="img/eggs.png" alt="eggs" class="card_icon" />
          <div class="card_title">eggs</div>
        </li>
        <li class="card">

      <h3>... Thats all ...</h3>
